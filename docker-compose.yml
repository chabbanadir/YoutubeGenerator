version: "3.9"

services:
  youtube-generator:
    build: .
    container_name: youtube_generator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace:rw
      - ./wwwroot:/app/wwwroot:rw
      - ./appsettings.production.json:/app/appsettings.Production.json:ro  # optional override
    environment:
      # .NET environment
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Tools__YtDlpPath=/usr/bin/yt-dlp
      # Application configuration (secure injection)
      - Google__ApiKey=${GOOGLE_API_KEY}
      - GitHub__Token=${GITHUB_TOKEN}


    # Option A: use env_file to inject secrets
    env_file:
      - .env

    # Resource limits (8GB RAM, 3.5 CPUs)
    mem_limit: 8192M
    cpus: 3.5
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 8192M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  ngrok:
    image: ngrok/ngrok:latest
    container_name: youtube_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "youtube_generator:8080"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - youtube-generator

