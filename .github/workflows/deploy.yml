name: CI/CD Pipeline - YoutubeGenerator

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    name: Build & Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting Deployment for YoutubeGenerator..."
            cd /home/${{ secrets.VPS_USER }}/YoutubeGenerator
            git fetch origin
            git checkout prod
            git pull origin prod
            docker compose up -d --build --remove-orphans
            docker image prune -f
            echo "✅ YoutubeGenerator deployed successfully on prod!"
